    country: EG
    lang: ar
    feeds:
      - { url: "https://www.almasryalyoum.com/rss/rssfeeds", kind: rss }

  # Youm7's feed carries no publication dates: articles are stamped with the time they were first seen.
  - name: Youm7
    domain: youm7.com
    sourcetype: ONLINENEWS_NEWSPAPER
    country: EG
    lang: ar
    feeds:
