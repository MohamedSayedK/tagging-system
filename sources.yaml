# Outlets to crawl. `interval` is how often the worker re-reads a source (default 15m);
# failing sources back off automatically. Edits are picked up by a running worker (no restart).
#
# sourcetype values are free-form but should match what you use in queries
# (sourcetype:ONLINENEWS_NEWSPAPER, ...). Every feed below was fetched and parsed on 2026-10-11.
sources:
  # ---- Saudi Arabia ----
  - name: Arab News
    domain: arabnews.com
    sourcetype: ONLINENEWS_NEWSPAPER
    country: SA
    lang: en
    feeds:
      - { url: "https://www.arabnews.com/rss.xml", kind: rss }

  - name: Saudi Gazette
    domain: saudigazette.com.sa
    sourcetype: ONLINENEWS_NEWSPAPER
    country: SA
    lang: en
    feeds:
      - { url: "https://saudigazette.com.sa/rssFeed/74", kind: rss }

  - name: Okaz
    domain: okaz.com.sa
    sourcetype: ONLINENEWS_NEWSPAPER
    country: SA
    lang: ar
    feeds:
      - { url: "https://www.okaz.com.sa/rssFeed/0", kind: rss }

  - name: Asharq Al-Awsat
    domain: aawsat.com
    sourcetype: ONLINENEWS_NEWSPAPER
    country: GB
    lang: ar
    feeds:
      - { url: "https://aawsat.com/feed", kind: rss }

  - name: Asharq Al-Awsat English
    domain: aawsat.com
    sourcetype: ONLINENEWS_NEWSPAPER
    country: GB
    lang: en
    feeds:
      - { url: "https://english.aawsat.com/feed", kind: rss }

  # ---- Egypt ----
