<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tagging System</title>
    <meta name="color-scheme" content="light dark" />
    <script>
      // Apply a saved theme before first paint so a dark reader never sees a white flash.
      try {
        var t = localStorage.getItem("tagging.theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&family=Libre+Franklin:wght@400;500;600;700;800&family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"><p style="margin:0;padding:48px 24px;font:500 16px/1.5 system-ui,sans-serif;color:#6b7686">Loading Tagging System…</p></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
